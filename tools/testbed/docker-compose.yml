version: '3.8'

services:
  # Isolated BEP 5 / BEP 44 DHT Testbed Runner (100-300 Virtual Kademlia Nodes)
  dht-testbed:
    build:
      context: ../..
      dockerfile: tools/testbed/Dockerfile
    container_name: pqchat-dht-testbed
    volumes:
      - ../../docs:/app/docs
      - .:/app/tools/testbed
    networks:
      pqchat-isolated-net:
        ipv4_address: 172.28.0.10
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "tools.testbed.testbed_runner", "--runs", "100", "--nodes", "150"]

networks:
  pqchat-isolated-net:
    name: pqchat_isolated_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
