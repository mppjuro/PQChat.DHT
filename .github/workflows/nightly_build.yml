name: Nightly Build

on:
  schedule:
    # Uruchamiane codziennie o 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Możliwość ręcznego wyzwolenia z zakładki Actions

permissions:
  contents: write

jobs:
  build-and-release-nightly:
    name: Build & Release Nightly APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Nightly APK
        id: prepare_apk
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          APK_NAME="PQChat.DHT-nightly-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly Build (${{ env.SHORT_SHA }})"
          body: |
            ## 🌙 PQChat.DHT Nightly Build

            Automatyczna codzienna kompilacja wersji deweloperskiej (`app-debug.apk`).

            - **Commit:** [`${{ env.SHORT_SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Data kompilacji:** ${{ env.BUILD_DATE }}
            - **Plik APK:** `${{ env.APK_NAME }}`

            > [!NOTE]
            > Niniejszy pakiet APK jest wersją deweloperską z publicznym kluczem debugowania. Wymaga włączenia instalacji z nieznanych źródeł w systemie Android.
          prerelease: true
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
