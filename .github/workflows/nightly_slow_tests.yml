name: Nightly Slow & Integration Tests

on:
  schedule:
    # Uruchamiane co noc o 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Możliwość ręcznego wyzwolenia z poziomu interfejsu GitHub

jobs:
  slow-tests:
    name: Run Slow Unit & Repository Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Slow & Nightly Integration Tests (@Tag("slow") & Repository Tests)
        run: ./gradlew testDebugUnitTest -DrunSlowTests=true -DrunNightlyTests=true
        env:
          RUN_SLOW_TESTS: "true"
          RUN_NIGHTLY_TESTS: "true"

      - name: Upload Slow Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-test-results
          path: app/build/reports/tests/testDebugUnitTest/
