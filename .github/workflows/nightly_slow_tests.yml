name: Nightly Slow & Integration Tests

on:
  schedule:
    # Uruchamiane co noc o 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Możliwość ręcznego wyzwolenia z poziomu interfejsu GitHub

jobs:
  slow-tests:
    name: Run Slow Unit & Repository Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Slow Tests (@Tag("slow") & Repository Tests)
        run: ./gradlew testDebugUnitTest -DrunSlowTests=true

      - name: Upload Slow Test Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: slow-test-results
          path: app/build/reports/tests/testDebugUnitTest/
