name: Nightly Tests & Release

on:
  schedule:
    # Runs daily at midnight Polish time (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip publishing Nightly Release (run tests only)'
        type: boolean
        required: false
        default: false
      quick:
        description: 'Quick mode (smoke test for testbed)'
        type: boolean
        required: false
        default: false
      use_fake_dht:
        description: 'Use FakeDht in two-device end-to-end test (default true = faster reliable CI)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  fast-unit-tests:
    name: Fast Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Fast Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Verify Room Schema Consistency
        run: |
          ./gradlew kspDebugKotlin
          if ! git diff --exit-code app/schemas; then
            echo "ERROR: Room schema files are not up-to-date with current database entities!"
            echo "Please build the project and commit the updated schema files under app/schemas/."
            exit 1
          fi

      - name: Upload Fast Unit Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

  slow-repository-tests:
    name: Slow Repository & Rekey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Run Slow Repository & Rekey Tests
        run: ./gradlew testDebugUnitTest -DrunSlowTests=true -DrunNightlyTests=true --tests "org.pqchat.dht.data.repository.*"
        env:
          RUN_SLOW_TESTS: "true"
          RUN_NIGHTLY_TESTS: "true"

      - name: Upload Repository Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-repository-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  slow-statistical-tests:
    name: Slow Statistical, Tor & Measurement Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Run Slow Statistical, Tor & Measurement Tests
        run: ./gradlew testDebugUnitTest -DrunSlowTests=true -DrunNightlyTests=true --tests "org.pqchat.dht.traffic.TrafficThreatModelStatisticalTest" --tests "org.pqchat.dht.network.tor.DhtClientTorIntegrationTest" --tests "org.pqchat.dht.debug.LoopbackMeasurementHarnessTest"
        env:
          RUN_SLOW_TESTS: "true"
          RUN_NIGHTLY_TESTS: "true"

      - name: Upload Statistical & Tor Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-statistical-test-results
          path: app/build/reports/tests/testDebugUnitTest/

  remote-dht-tests:
    name: Real BEP 44 Remote Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Run Real BEP 44 Remote Integration Tests (with retry)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 11
          max_attempts: 2
          command: ./gradlew testDebugUnitTest -DrunRealDhtTests=true -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" --tests "org.pqchat.dht.dht.integration.RealBep44RemoteIntegrationTest*" --info

      - name: Upload Remote Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-bep44-test-results
          path: app/build/reports/tests/testDebugUnitTest/

  real-dht-measurements:
    name: Real DHT Loopback & Retention Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python visualization dependencies
        run: |
          pip install numpy matplotlib

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Run Real DHT Measurements
        run: |
          ./gradlew testDebugUnitTest -DrunRealDhtTests=true -DmeasuredIterations=50 --tests "org.pqchat.dht.dht.integration.RealBep44RemoteIntegrationTest.testRealBep44RemoteFullPercentilesAndDeliverySuccessAcrossProfiles" --info
          python3 tools/dht_harness/dht_loopback_harness.py
        env:
          RUN_REAL_DHT_TESTS: "true"
          MEASURED_ITERATIONS: "50"

      - name: Publish Real DHT Measurement Summary to GitHub Job Summary
        if: always()
        run: |
          echo "## 📊 Real DHT 500-Iteration Measurement Suite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "docs/dht_retention_report.md" ]; then
            cat docs/dht_retention_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Real DHT Measurement CSVs and Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-dht-measurements
          path: |
            docs/metrics_dht_loopback_measured.csv
            docs/dht_retention_latency_chart.png
            tools/dht_harness/dht_retention_latency_chart.png
            docs/dht_retention_report.md
            docs/measurements/*.csv
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  dht-testbed:
    name: BEP 5/44 Real Traffic Testbed & Threat Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/threat_sim/requirements.txt

      - name: Run Real Traffic Testbed (150 Isolated DHT Nodes)
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then
            python -m tools.testbed.testbed_runner --quick
          else
            python -m tools.testbed.testbed_runner --runs 100 --nodes 150
          fi

      - name: Run Threat Simulator & Generate Comparison
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then
            python tools/threat_sim/threat_simulator.py --quick
          else
            python tools/threat_sim/threat_simulator.py --runs 100
          fi

      - name: Publish Testbed Summary to GitHub Job Summary
        if: always()
        run: |
          echo "## 🌐 DHT Real Traffic Testbed & Threat Analysis (150 Isolated Nodes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Testbed Nodes:** 150 BEP 5 / BEP 44 virtual nodes with XOR metric" >> $GITHUB_STEP_SUMMARY
          echo "- **Client Pairs:** 25 pairs (50 clients) with Ephemeral Key Hopping" >> $GITHUB_STEP_SUMMARY
          echo "- **Correlation Evaluation:** Timing, 0-PUT filtering, Intersection, and Sybil attacks" >> $GITHUB_STEP_SUMMARY
          if [ -f "tools/testbed/metrics_testbed_correlation.csv" ]; then
            echo "- ✅ Measured telemetry CSV generated: \`tools/testbed/metrics_testbed_correlation.csv\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Testbed Telemetry & Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dht-testbed-correlation-artifacts
          path: |
            tools/testbed/metrics_testbed_correlation.csv
            tools/testbed/testbed_correlation_measured.png
            tools/threat_sim/metrics_threat_sim.csv
            tools/threat_sim/tradeoff_anonymity_bandwidth_battery.png
            docs/testbed_correlation_measured.png
            docs/tradeoff_anonymity_bandwidth_battery.png

  e2e-two-devices-test:
    name: Two Devices End-to-End Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Run Two Devices End-to-End Test
        run: |
          USE_FAKE="${{ inputs.use_fake_dht || 'true' }}"
          if [ "$USE_FAKE" = "false" ]; then
            echo "Running Two Devices E2E Integration Test using Real DhtLeafNode..."
            ./gradlew testDebugUnitTest -DrunSlowTests=true -DuseFakeDht=false --tests "org.pqchat.dht.e2e.TwoDevicesE2EIntegrationTest"
          else
            echo "Running Two Devices E2E Integration Test using FakeDht..."
            ./gradlew testDebugUnitTest -DrunSlowTests=true -DuseFakeDht=true --tests "org.pqchat.dht.e2e.TwoDevicesE2EIntegrationTest"
          fi
        env:
          RUN_SLOW_TESTS: "true"
          USE_FAKE_DHT: "${{ inputs.use_fake_dht || 'true' }}"

      - name: Upload E2E Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-two-devices-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  adversarial-dht-simulation:
    name: Byzantine & Adversarial DHT Attack Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/threat_sim/requirements.txt

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Run JUnit Adversarial Security Tests
        run: ./gradlew testDebugUnitTest --tests "org.pqchat.dht.dht.AdversarialDhtSecurityTest"

      - name: Run Python Byzantine & Adversarial Attack Simulation Suite
        run: python -m tools.testbed.attackers --run-adversarial-suite

      - name: Publish Adversarial Simulation Summary to GitHub Job Summary
        if: always()
        run: |
          echo "## ⚔️ Byzantine & Adversarial DHT Attack Simulation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Attack Profile | Threat Vector | Defense Mechanism | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **Sybil & Eclipse** | Routing table /24 subnet flooding | Subnet bucketing (max 2 nodes per /24) | ✅ DEFENDED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Payload Mutator** | Bit flipping in v/sig/k/Bencode | Strict 900B framing + GCM tag + Ed25519 | ✅ REJECTED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Sequence Rollback** | Replay of old seq numbers & tombstone suppression | Strict seq monotonically increasing + 900B tombstone | ✅ MITIGATED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timing & Traffic Analysis** | Inter-arrival timing correlation | Poisson cover traffic + decoy hops | ✅ OBFUSCATED |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Adversarial Simulation Results & CSVs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adversarial-simulation-results
          path: |
            docs/adversarial_simulation_results.csv
            tools/testbed/adversarial_simulation_results.csv
            app/build/reports/tests/testDebugUnitTest/

  nightly-release:
    name: Build & Publish Nightly Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fast-unit-tests, slow-repository-tests, slow-statistical-tests, remote-dht-tests, real-dht-measurements, dht-testbed, e2e-two-devices-test, adversarial-dht-simulation]
    if: success() && (inputs.skip_release != true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Nightly APK
        id: prepare_apk
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE_TAG=$(date -u +'%Y-%m-%d')
          APK_NAME="PQChat.DHT-nightly-${DATE_TAG}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly Build (${{ env.DATE_TAG }}-${{ env.SHORT_SHA }})"
          body: |
            ## 🌙 PQChat.DHT Nightly Build

            Automated daily developer build (`app-debug.apk`) after passing the full nightly test suite:
            - **Fast Unit Tests:** Zaliczone (standardowa suita jednostkowa)
            - **Slow Repository & Rekey Tests:** Zaliczone (PQC Rekey, ChatRepository Concurrency, Polling, Property)
            - **Slow Statistical & Tor Tests:** Zaliczone (Monte Carlo, Tor SOCKS5 fail-closed, Loopback Harness)
            - **Two Devices End-to-End Lifecycle:** Passed (Handshake, >10 Msg, Rekey after 50 messages, Out-of-Order / SlidingWindowBitmap, DhtLeafNode / FakeDht)
            - **Real BEP 44 Remote Integration Tests:** Zaliczone (Live Mainline DHT)
            - **Real DHT Loopback & Retention Suite:** Passed (500 iterations per environment, live Mainline DHT)
            - **DHT Real Traffic Testbed & Threat Analysis:** Passed (150 Kademlia nodes)
            - **Byzantine & Adversarial DHT Attack Simulation:** Zaliczone (Sybil / Eclipse /24 subnet bucketing, Active Bit-Flipper & Tampering rejection, BEP 44 Sequence Rollback & Tombstone suppression, Global Timing Correlation Analysis)

            ### Metadane kompilacji:
            - **Commit:** [`${{ env.SHORT_SHA }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Data wydania:** ${{ env.BUILD_DATE }}
            - **Pakiet APK:** `${{ env.APK_NAME }}`

            > [!NOTE]
            > This APK package is a developer build signed with a public debug key. Requires enabling installation from unknown sources on Android.
          prerelease: true
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Nightly Release Job Summary
        if: always()
        run: |
          echo "## 🚀 Nightly Release Successfully Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`nightly\` (${{ env.DATE_TAG }}-${{ env.SHORT_SHA }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** [${{ env.APK_NAME }}](https://github.com/${{ github.repository }}/releases/tag/nightly)" >> $GITHUB_STEP_SUMMARY
