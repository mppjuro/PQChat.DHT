name: Nightly Tests & Release

on:
  schedule:
    # Runs daily at midnight Polish time (22:00 UTC)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip publishing Nightly Release (run tests only)'
        type: boolean
        required: false
        default: false
      quick:
        description: 'Quick mode (smoke test for testbed)'
        type: boolean
        required: false
        default: false
      use_fake_dht:
        description: 'Use simulated/fake DHT instead of real Mainline DHT (manual opt-in only; default false = real DHT)'
        type: boolean
        required: false
        default: false
      nodes:
        description: 'Number of emulator instances for multi-emulator E2E (2, 3, 4, or all)'
        type: choice
        required: false
        default: 'all'
        options:
          - 'all'
          - '2'
          - '3'
          - '4'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_PREFS_ROOT: /home/runner
  ANDROID_SDK_HOME: /home/runner
  ANDROID_AVD_HOME: /home/runner/.android/avd
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

jobs:
  fast-unit-tests:
    name: Fast Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Fast Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Firebase Research Telemetry Schema & Live Sync
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: python3 scripts/verify_firebase_telemetry_ci.py

      - name: Verify Room Schema Consistency
        run: |
          ./gradlew kspDebugKotlin
          if ! git diff --exit-code app/schemas; then
            echo "ERROR: Room schema files are not up-to-date with current database entities!"
            echo "Please build the project and commit the updated schema files under app/schemas/."
            exit 1
          fi

      - name: Upload Fast Unit Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

  slow-repository-tests:
    name: Slow Repository & Rekey Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Run Slow Repository & Rekey Tests
        run: ./gradlew testDebugUnitTest -DrunSlowTests=true -DrunNightlyTests=true --tests "org.pqchat.dht.data.repository.*"
        env:
          RUN_SLOW_TESTS: "true"
          RUN_NIGHTLY_TESTS: "true"

      - name: Upload Repository Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-repository-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  slow-statistical-tests:
    name: Slow Statistical, Tor & Measurement Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Run Slow Statistical, Tor & Measurement Tests
        run: ./gradlew testDebugUnitTest -DrunSlowTests=true -DrunNightlyTests=true --tests "org.pqchat.dht.traffic.TrafficThreatModelStatisticalTest" --tests "org.pqchat.dht.network.tor.DhtClientTorIntegrationTest" --tests "org.pqchat.dht.debug.LoopbackMeasurementHarnessTest"
        env:
          RUN_SLOW_TESTS: "true"
          RUN_NIGHTLY_TESTS: "true"

      - name: Upload Statistical & Tor Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slow-statistical-test-results
          path: app/build/reports/tests/testDebugUnitTest/

  remote-dht-tests:
    name: Real BEP 44 Remote Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Run Real BEP 44 Remote Integration Tests (with retry)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 11
          max_attempts: 2
          command: ./gradlew testDebugUnitTest -DrunRealDhtTests=true -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" --tests "org.pqchat.dht.dht.integration.RealBep44RemoteIntegrationTest*" --info

      - name: Upload Remote Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-bep44-test-results
          path: app/build/reports/tests/testDebugUnitTest/

  real-dht-measurements:
    name: Real DHT Loopback & Retention Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python visualization dependencies
        run: |
          pip install numpy matplotlib

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Run Real DHT Measurements
        run: |
          ./gradlew testDebugUnitTest -DrunRealDhtTests=true -DmeasuredIterations=50 --tests "org.pqchat.dht.dht.integration.RealBep44RemoteIntegrationTest.testRealBep44RemoteFullPercentilesAndDeliverySuccessAcrossProfiles" --info
          python3 tools/dht_harness/dht_loopback_harness.py
        env:
          RUN_REAL_DHT_TESTS: "true"
          MEASURED_ITERATIONS: "50"

      - name: Publish Real DHT Measurement Summary to GitHub Job Summary
        if: always()
        run: |
          echo "## 📊 Real DHT 500-Iteration Measurement Suite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "docs/dht_retention_report.md" ]; then
            cat docs/dht_retention_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Real DHT Measurement CSVs and Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: real-dht-measurements
          path: |
            docs/metrics_dht_loopback_measured.csv
            docs/dht_retention_latency_chart.png
            tools/dht_harness/dht_retention_latency_chart.png
            docs/dht_retention_report.md
            docs/measurements/*.csv
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  dht-testbed:
    name: BEP 5/44 Real Traffic Testbed & Threat Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/threat_sim/requirements.txt

      - name: Run Real Traffic Testbed (150 Isolated DHT Nodes)
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then
            python -m tools.testbed.testbed_runner --quick
          else
            python -m tools.testbed.testbed_runner --nodes 150 --runs 100
          fi

      - name: Run Threat Simulator & Generate Comparison
        run: |
          if [ "${{ inputs.quick }}" = "true" ]; then
            python tools/threat_sim/threat_simulator.py --quick
          else
            python tools/threat_sim/threat_simulator.py --runs 100
          fi

      - name: Publish Testbed Summary to GitHub Job Summary
        if: always()
        run: |
          echo "## 🌐 DHT Real Traffic Testbed & Threat Analysis (150 Isolated Nodes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Testbed Nodes:** 150 BEP 5 / BEP 44 virtual nodes with XOR metric" >> $GITHUB_STEP_SUMMARY
          echo "- **Client Pairs:** 25 pairs (50 clients) with Ephemeral Key Hopping" >> $GITHUB_STEP_SUMMARY
          echo "- **Correlation Evaluation:** Timing, 0-PUT filtering, Intersection, and Sybil attacks" >> $GITHUB_STEP_SUMMARY
          if [ -f "tools/testbed/metrics_testbed_correlation.csv" ]; then
            echo "- ✅ Measured telemetry CSV generated: \`tools/testbed/metrics_testbed_correlation.csv\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Testbed Telemetry & Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dht-testbed-correlation-artifacts
          path: |
            tools/testbed/metrics_testbed_correlation.csv
            tools/testbed/testbed_correlation_measured.png
            tools/threat_sim/metrics_threat_sim.csv
            tools/threat_sim/tradeoff_anonymity_bandwidth_battery.png
            docs/testbed_correlation_measured.png
            docs/tradeoff_anonymity_bandwidth_battery.png

  e2e-two-devices-test:
    name: Two Devices End-to-End Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Run Two Devices End-to-End Test
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.use_fake_dht == true }}" = "true" ]; then
            echo "Running Two Devices E2E Integration Test using FakeDht (manual opt-in)..."
            ./gradlew testDebugUnitTest -DrunSlowTests=true -DuseFakeDht=true --tests "org.pqchat.dht.e2e.TwoDevicesE2EIntegrationTest"
          else
            echo "Running Two Devices E2E Integration Test using Real DhtLeafNode..."
            ./gradlew testDebugUnitTest -DrunSlowTests=true -DuseFakeDht=false --tests "org.pqchat.dht.e2e.TwoDevicesE2EIntegrationTest"
          fi
        env:
          RUN_SLOW_TESTS: "true"
          USE_FAKE_DHT: "${{ github.event_name == 'workflow_dispatch' && inputs.use_fake_dht == true }}"

      - name: Upload E2E Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-two-devices-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  adversarial-dht-simulation:
    name: Byzantine & Adversarial DHT Attack Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/threat_sim/requirements.txt

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Run JUnit Adversarial Security Tests
        run: ./gradlew testDebugUnitTest --tests "org.pqchat.dht.dht.AdversarialDhtSecurityTest"

      - name: Run Python Byzantine & Adversarial Attack Simulation Suite
        run: |
          python -m tools.testbed.attackers --run-adversarial-suite --require-plots
          test -s docs/adversarial_simulation_results.csv
          test -s tools/testbed/adversarial_simulation_results.csv
          test -s docs/adversarial_defense_effectiveness.png
          test -s tools/testbed/adversarial_defense_effectiveness.png

      - name: Publish Adversarial Simulation Summary to GitHub Job Summary
        if: always()
        run: |
          echo "## Byzantine & Adversarial DHT Attack Simulation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Attack Profile | Threat Vector | Defense Mechanism | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **Active Eclipse & Routing Poisoning** | Fabricated XOR-close /24 nodes + bogons (0.0.0.0:0, multicast, link-local) | Bogon sanitization + strict /24 bucketing (max 2/subnet, no backfill) | DEFENDED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Token & Signature MITM** | Bit-flips in v/sig/seq/salt, sig/salt stripping, >64B tokens, seq overflow | Ed25519 + target SHA-1(k+salt) binding + bounded token/seq verification | REJECTED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Selective Drop & Tombstone Suppression** | Fast stale seq=1 replay & 0x03/0x04 Rekey blackholing | Quorum highest-seq tombstone resolution + K=8 multi-replica quorum | MITIGATED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Global Timing & Group Intersection** | Bayesian recipient linking on deriveGroupRecipientSlot across lambda | Shuffled WFQ Poisson cover emissions + N=8 populated decoy polling | OBFUSCATED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f docs/adversarial_simulation_results.csv ]; then
            echo "### Measured Adversarial CSV Telemetry" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python -c "import csv; r=list(csv.DictReader(open('docs/adversarial_simulation_results.csv', encoding='utf-8'))); print('| Category | Metric | Value | Defense | Mitigated |\n| :--- | :--- | ---: | :---: | :---: |'); print('\n'.join(f\"| {x['metric_category']} | {x['attack_parameter']} | {x['value']} | {x['defense_active']} | {x['mitigated']} |\" for x in r))" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Adversarial Simulation Results, Plots & CSVs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adversarial-simulation-results
          path: |
            docs/adversarial_simulation_results.csv
            tools/testbed/adversarial_simulation_results.csv
            docs/adversarial_defense_effectiveness.png
            tools/testbed/adversarial_defense_effectiveness.png
            app/build/reports/tests/testDebugUnitTest/

  multi-emulator-dht-real-e2e:
    name: Multi-Emulator ${{ matrix.mode }} DHT E2E (${{ matrix.nodes }} Nodes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        mode: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.use_fake_dht == true && '["testbed"]') || '["real"]') }}
        nodes: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.nodes != '' && inputs.nodes != 'all' && format('["{0}"]', inputs.nodes)) || '["2","3","4"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          sudo usermod -aG kvm $USER || true
          ls -la /dev/kvm || true

      - name: Install emulator runtime libraries
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libpulse0

      - name: Allocate 8GB Extra Swap Space
        run: |
          echo "=== Adding 8GB extra swap space for multi-node stability ==="
          sudo fallocate -l 8G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=8192
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          free -h

      - name: Configure Android SDK Environment and PATH
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV

          # Detect cmdline-tools directory containing sdkmanager and avdmanager
          CMDLINE_DIR=""
          if [ -d "$ANDROID_ROOT/cmdline-tools/latest/bin" ]; then
            CMDLINE_DIR="$ANDROID_ROOT/cmdline-tools/latest/bin"
          else
            for d in "$ANDROID_ROOT/cmdline-tools"/*/bin; do
              if [ -x "$d/sdkmanager" ]; then
                CMDLINE_DIR="$d"
                break
              fi
            done
          fi

          if [ -n "$CMDLINE_DIR" ]; then
            echo "Configuring cmdline-tools from: $CMDLINE_DIR"
            echo "$CMDLINE_DIR" >> $GITHUB_PATH
          fi

          echo "$ANDROID_ROOT/emulator" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Cache Android System Image & Emulator
        uses: actions/cache@v6
        id: sysimg-cache
        with:
          path: |
            /usr/local/lib/android/sdk/system-images/android-34
            /usr/local/lib/android/sdk/emulator
          key: sysimg-emulator-android-34-x86_64-v1

      - name: Set up Android SDK & Multi-Node AVDs
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi
          for d in "$ANDROID_HOME/cmdline-tools"/*/bin; do
            if [ -x "$d/sdkmanager" ]; then
              export PATH="$d:$PATH"
              break
            fi
          done
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          export API_LEVEL="34"
          export SYS_IMG="system-images;android-${API_LEVEL};google_apis;x86_64"
          export NODES="${{ matrix.nodes }}"

          yes 2>/dev/null | sdkmanager --licenses > /dev/null || true

          if [ ! -f "$ANDROID_HOME/emulator/package.xml" ] || [ ! -x "$ANDROID_HOME/emulator/emulator" ]; then
            yes 2>/dev/null | sdkmanager --install "emulator" "platform-tools" "platforms;android-${API_LEVEL}"
          fi

          if [ ! -d "$ANDROID_HOME/system-images/android-${API_LEVEL}/google_apis/x86_64" ]; then
            yes 2>/dev/null | sdkmanager --install "$SYS_IMG" "platforms;android-${API_LEVEL}"
          fi

          mkdir -p "$ANDROID_AVD_HOME"
          mkdir -p /home/runner/.android/avd

          echo "=== Creating Alice AVD ==="
          echo "no" | avdmanager create avd -n alice_avd -k "$SYS_IMG" -p "$ANDROID_AVD_HOME/alice_avd.avd" --device "pixel_6" --force || \
          echo "no" | avdmanager create avd -n alice_avd -k "$SYS_IMG" -p "$ANDROID_AVD_HOME/alice_avd.avd" --force

          echo "=== Creating Bob AVD ==="
          echo "no" | avdmanager create avd -n bob_avd -k "$SYS_IMG" -p "$ANDROID_AVD_HOME/bob_avd.avd" --device "pixel_6" --force || \
          echo "no" | avdmanager create avd -n bob_avd -k "$SYS_IMG" -p "$ANDROID_AVD_HOME/bob_avd.avd" --force

          if [ "$NODES" -ge 3 ]; then
            echo "=== Creating Charlie AVD ==="
            echo "no" | avdmanager create avd -n charlie_avd -k "$SYS_IMG" -p "$ANDROID_AVD_HOME/charlie_avd.avd" --device "pixel_6" --force || \
            echo "no" | avdmanager create avd -n charlie_avd -k "$SYS_IMG" -p "$ANDROID_AVD_HOME/charlie_avd.avd" --force
          fi

          if [ "$NODES" -ge 4 ]; then
            echo "=== Creating Dave AVD ==="
            echo "no" | avdmanager create avd -n dave_avd -k "$SYS_IMG" -p "$ANDROID_AVD_HOME/dave_avd.avd" --device "pixel_6" --force || \
            echo "no" | avdmanager create avd -n dave_avd -k "$SYS_IMG" -p "$ANDROID_AVD_HOME/dave_avd.avd" --force
          fi

          if [ -d "/home/runner/.config/.android/avd" ]; then
            cp -rn /home/runner/.config/.android/avd/* "$ANDROID_AVD_HOME/" 2>/dev/null || true
          fi
          for avd_name in alice_avd bob_avd $( [ "$NODES" -ge 3 ] && echo charlie_avd ) $( [ "$NODES" -ge 4 ] && echo dave_avd ); do
            if [ ! -f "$ANDROID_AVD_HOME/${avd_name}.ini" ]; then
              find /home/runner -name "${avd_name}.ini" -exec cp {} "$ANDROID_AVD_HOME/" \; 2>/dev/null || true
            fi
          done

          RAM_MB=2048
          if [ "$NODES" -ge 3 ]; then
            RAM_MB=1536
          fi
          for avd_dir in "$ANDROID_AVD_HOME"/*.avd; do
            if [ -d "$avd_dir" ]; then
              sed -i '/hw.keyboard/d' "$avd_dir/config.ini" || true
              sed -i '/hw.ramSize/d' "$avd_dir/config.ini" || true
              sed -i '/vm.heapSize/d' "$avd_dir/config.ini" || true
              sed -i '/hw.audioInput/d' "$avd_dir/config.ini" || true
              sed -i '/hw.audioOutput/d' "$avd_dir/config.ini" || true
              sed -i '/hw.gps/d' "$avd_dir/config.ini" || true
              echo "hw.keyboard = yes" >> "$avd_dir/config.ini"
              echo "hw.ramSize = $RAM_MB" >> "$avd_dir/config.ini"
              echo "vm.heapSize = 384" >> "$avd_dir/config.ini"
              echo "hw.audioInput = no" >> "$avd_dir/config.ini"
              echo "hw.audioOutput = no" >> "$avd_dir/config.ini"
              echo "hw.gps = no" >> "$avd_dir/config.ini"
            fi
          done

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug
          ./gradlew --stop

      - name: Launch Android Emulators Headless
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_PREFS_ROOT="/home/runner"
          export ANDROID_SDK_HOME="/home/runner"
          export ANDROID_AVD_HOME="/home/runner/.android/avd"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          EMULATOR_BIN="$(command -v emulator || echo "$ANDROID_HOME/emulator/emulator")"

          NODES="${{ matrix.nodes }}"
          RAM_MB=2048
          if [ "$NODES" -ge 3 ]; then
            RAM_MB=1536
          fi
          EMU_OPTS="-no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -no-metrics -no-snapshot-save -memory $RAM_MB -cores 2"

          mkdir -p /tmp/emu_logs

          echo "Starting Alice (emulator-5554)..."
          nohup $EMULATOR_BIN -avd alice_avd -port 5554 $EMU_OPTS > /tmp/emu_5554.log 2>&1 &
          sleep 5

          echo "Starting Bob (emulator-5556)..."
          nohup $EMULATOR_BIN -avd bob_avd -port 5556 $EMU_OPTS > /tmp/emu_5556.log 2>&1 &
          sleep 5

          if [ "$NODES" -ge 3 ]; then
            echo "Starting Charlie (emulator-5558)..."
            nohup $EMULATOR_BIN -avd charlie_avd -port 5558 $EMU_OPTS > /tmp/emu_5558.log 2>&1 &
            sleep 5
          fi

          if [ "$NODES" -ge 4 ]; then
            echo "Starting Dave (emulator-5560)..."
            nohup $EMULATOR_BIN -avd dave_avd -port 5560 $EMU_OPTS > /tmp/emu_5560.log 2>&1 &
            sleep 5
          fi

      - name: Wait for All Emulators to Complete Boot
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          python3 - << 'EOF'
          import subprocess, time, sys, os

          subprocess.run(["adb", "start-server"], check=False)

          nodes = int("${{ matrix.nodes }}")
          device_ports = [5554, 5556]
          if nodes >= 3:
              device_ports.append(5558)
          if nodes >= 4:
              device_ports.append(5560)

          devices = [f"emulator-{p}" for p in device_ports]
          timeout_seconds = 600

          for dev in devices:
              port = dev.replace("emulator-", "")
              log_file = f"/tmp/emu_{port}.log"
              print(f"Waiting for {dev} to be ready...", flush=True)
              start_time = time.time()
              while time.time() - start_time < timeout_seconds:
                  try:
                      res = subprocess.run(
                          ["adb", "-s", dev, "shell", "getprop", "sys.boot_completed"],
                          capture_output=True,
                          text=True,
                          timeout=10
                      )
                      if res.stdout.strip() == "1":
                          print(f"[{dev}] sys.boot_completed == 1. Ready in {int(time.time() - start_time)}s!", flush=True)
                          break
                  except Exception:
                      pass
                  time.sleep(3)
              else:
                  print(f"ERROR: {dev} failed to boot within {timeout_seconds} seconds!", file=sys.stderr)
                  sys.exit(1)
          EOF

          NODES="${{ matrix.nodes }}"
          DEVS="emulator-5554 emulator-5556"
          if [ "$NODES" -ge 3 ]; then DEVS="$DEVS emulator-5558"; fi
          if [ "$NODES" -ge 4 ]; then DEVS="$DEVS emulator-5560"; fi

          DEBLOAT_PKGS="com.google.android.inputmethod.latin com.android.inputmethod.latin com.google.android.settings.intelligence com.android.settings.intelligence com.google.android.dialer com.android.dialer com.google.android.apps.wellbeing com.google.android.googlequicksearchbox com.google.android.as com.google.android.as.oss com.google.android.gms com.google.android.gsf com.google.android.apps.messaging com.google.android.apps.youtube.music com.google.android.youtube com.google.android.gm com.google.android.apps.maps com.google.android.apps.photos com.android.vending com.android.chrome com.google.android.configupdater com.google.android.tts com.google.android.contacts"

          for dev in $DEVS; do
            adb -s $dev wait-for-device
            adb -s $dev shell "
              settings put global window_animation_scale 0.0
              settings put global transition_animation_scale 0.0
              settings put global animator_duration_scale 0.0
              svc power stayon true
              settings put system screen_off_timeout 2147483647
              settings put global hide_error_dialogs 1
              settings put secure immersive_mode_confirmations confirmed
              settings put secure show_ime_with_hard_keyboard 0
              settings put global heads_up_notifications_enabled 0
              cmd notification set_dnd on
              cmd media_session volume --stream 5 --set 0
              cmd media_session volume --stream 2 --set 0
              input keyevent 224
              wm dismiss-keyguard
              input keyevent 82
              am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
              for pkg in $DEBLOAT_PKGS; do
                pm disable-user --user 0 \$pkg 2>/dev/null || true
                am force-stop \$pkg 2>/dev/null || true
              done
              logcat -G 16M
              logcat -c
            "
          done

      - name: Run Multi-Emulator E2E
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          if [ "${{ matrix.mode }}" = "real" ]; then
            DHT_ARGS="--real-dht --basic"
            OUTPUT_DIR="build/e2e-screenshots-real-dht-${{ matrix.nodes }}nodes"
          else
            DHT_ARGS=""
            OUTPUT_DIR="build/e2e-screenshots-dht-testbed-${{ matrix.nodes }}nodes"
          fi

          mkdir -p "$OUTPUT_DIR"
          python3 tools/e2e_emulator_orchestrator.py \
            $DHT_ARGS \
            --nodes ${{ matrix.nodes }} \
            --alice emulator-5554 \
            --bob emulator-5556 \
            --charlie emulator-5558 \
            --dave emulator-5560 \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --output-dir "$OUTPUT_DIR" \
            --skip-debloat \
            --e2e-fast-mode \
            $([ "${{ matrix.mode }}" = "testbed" ] && echo "--full")

      - name: Publish E2E Summary to GitHub Job Summary
        if: always()
        run: |
          if [ "${{ matrix.mode }}" = "real" ]; then
            REPORT_FILE="build/e2e-screenshots-real-dht-${{ matrix.nodes }}nodes/report.md"
            echo "## 📱 Multi-Emulator Real Mainline DHT Smoke Results (${{ matrix.nodes }} Nodes)" >> $GITHUB_STEP_SUMMARY
          else
            REPORT_FILE="build/e2e-screenshots-dht-testbed-${{ matrix.nodes }}nodes/report.md"
            echo "## 📱 Multi-Emulator DHT Testbed Results (${{ matrix.nodes }} Nodes)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Report file $REPORT_FILE was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload E2E Screenshots & Trace Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.mode }}-dht-e2e-trace-${{ matrix.nodes }}nodes
          path: |
            build/e2e-screenshots-dht-testbed-${{ matrix.nodes }}nodes/
            build/e2e-screenshots-real-dht-${{ matrix.nodes }}nodes/
            /tmp/emu_*.log

      - name: Stop Emulators
        if: always()
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          for port in 5554 5556 5558 5560; do
            adb -s emulator-$port emu kill 2>/dev/null || true
          done

  continuous-fuzzing:
    name: Continuous Fuzzing (Jazzer)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Restore Jazzer Fuzzing Corpus
        uses: actions/cache@v6
        with:
          path: app/.cifuzz-corpus
          key: jazzer-corpus-${{ runner.os }}-${{ hashFiles('app/src/test/java/org/pqchat/dht/dht/fuzz/**') }}
          restore-keys: |
            jazzer-corpus-${{ runner.os }}-

      - name: Run Continuous Jazzer Fuzz Targets
        env:
          JAZZER_FUZZ: "1"
        run: |
          mkdir -p app/.cifuzz-corpus
          ./gradlew testDebugUnitTest \
            --tests "org.pqchat.dht.dht.fuzz.JazzerFuzzTest" \
            -Djazzer.max_duration=15s

      - name: Publish Continuous Fuzzing Summary to GitHub Job Summary
        if: always()
        run: |
          echo "## Continuous Fuzzing Summary (Jazzer)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Targets Verified:** \`BencodeFuzzTarget\`, \`KrpcMessageFuzzTarget\`, \`BinaryFrameCodecFuzzTarget\` (0x01..0x0C + Cover-ACK), \`Png8CompressorFuzzTarget\`, \`KeystoreCryptoFuzzTarget\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Corpus Directory:** \`app/.cifuzz-corpus\` (cached via \`actions/cache@v6\`)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Jazzer Fuzzing Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jazzer-fuzzing-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  network-chaos-resilience:
    name: Network Chaos & Partition Resilience
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Run Network Chaos & Resilience Suite
        run: |
          ./gradlew testDebugUnitTest \
            --tests "org.pqchat.dht.chaos.NetworkChaosResilienceTest" \
            --tests "org.pqchat.dht.network.tor.TorFailClosedTest" \
            --tests "org.pqchat.dht.protocol.ChunkTransferResumptionTest"

      - name: Publish Network Chaos Summary to GitHub Job Summary
        if: always()
        run: |
          echo "## Network Chaos & Partition Resilience Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **UDP Loss (10%-40%) & Mid-Transfer Partition (0x05):** Verified chunk persistence and lossless reassembly" >> $GITHUB_STEP_SUMMARY
          echo "- **PQC Rekey Under Partition (0x03/0x04):** Verified pending offer retention, epoch sync, and outbox draining" >> $GITHUB_STEP_SUMMARY
          echo "- **CGNAT Port Rebinding:** Verified adaptive K=16, keepalive recovery, and live DhtLeafNode UDP socket rebinding" >> $GITHUB_STEP_SUMMARY
          echo "- **Tor Circuit Restart (Fail-Closed):** Verified zero clearnet UDP leaks during SOCKS5 outage and clean recovery" >> $GITHUB_STEP_SUMMARY

      - name: Upload Network Chaos Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: network-chaos-resilience-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

  generate-thesis-artifacts:
    name: Generate Master's Thesis LaTeX & Charts
    runs-on: ubuntu-latest
    needs: [real-dht-measurements, dht-testbed, adversarial-dht-simulation]
    if: always() && (needs.real-dht-measurements.result == 'success' || needs.dht-testbed.result == 'success' || needs.adversarial-dht-simulation.result == 'success')
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Plotting & Analysis Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib

      - name: Download Real DHT Measurement Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: real-dht-measurements
          path: build/ci_telemetry/real_dht

      - name: Download DHT Testbed Correlation Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: dht-testbed-correlation-artifacts
          path: build/ci_telemetry/testbed

      - name: Download Adversarial Simulation Artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: adversarial-simulation-results
          path: build/ci_telemetry/adversarial

      - name: Generate LaTeX Tables, 300 DPI Charts, and Markdown Summaries
        run: |
          mkdir -p build/thesis_bundle/tables build/thesis_bundle/charts build/thesis_bundle/summaries build/thesis_bundle/raw_csv build/thesis_bundle/analysis

          if [ -s build/ci_telemetry/real_dht/docs/metrics_dht_loopback_measured.csv ]; then
            cp build/ci_telemetry/real_dht/docs/metrics_dht_loopback_measured.csv docs/measurements/loopback_all.csv
          elif [ -s build/ci_telemetry/real_dht/metrics_dht_loopback_measured.csv ]; then
            cp build/ci_telemetry/real_dht/metrics_dht_loopback_measured.csv docs/measurements/loopback_all.csv
          fi

          if [ -s build/ci_telemetry/testbed/tools/testbed/metrics_testbed_correlation.csv ]; then
            cp build/ci_telemetry/testbed/tools/testbed/metrics_testbed_correlation.csv docs/measurements/metrics_testbed_correlation.csv
          elif [ -s build/ci_telemetry/testbed/metrics_testbed_correlation.csv ]; then
            cp build/ci_telemetry/testbed/metrics_testbed_correlation.csv docs/measurements/metrics_testbed_correlation.csv
          fi

          python3 tools/research_analyzer.py \
            --input-dir build/ci_telemetry \
            --input-dir docs/measurements \
            --output-dir build/thesis_bundle/analysis

          python3 scripts/generate_docs_tables.py

          find build/thesis_bundle/analysis -maxdepth 1 -name '*.tex' -exec cp {} build/thesis_bundle/tables/ \;
          find build/thesis_bundle/analysis -maxdepth 1 \( -name '*.pdf' -o -name '*.png' \) -exec cp {} build/thesis_bundle/charts/ \;
          find build/ci_telemetry -type f -name '*.png' -exec cp {} build/thesis_bundle/charts/ \;
          find build/ci_telemetry -type f -name '*.pdf' -exec cp {} build/thesis_bundle/charts/ \;
          find build/ci_telemetry -type f -name '*.csv' -exec cp {} build/thesis_bundle/raw_csv/ \;

          cp build/thesis_bundle/analysis/markdown_summary.md build/thesis_bundle/summaries/markdown_summary.md
          cp build/thesis_bundle/analysis/research_summary.json build/thesis_bundle/summaries/research_summary.json
          [ -f docs/dht_retention_report.md ] && cp docs/dht_retention_report.md build/thesis_bundle/summaries/
          [ -f docs/threat_model.md ] && cp docs/threat_model.md build/thesis_bundle/summaries/

          python3 - << 'EOF'
          import os, zipfile

          bundle_root = "build/thesis_bundle"
          zip_path = "build/master-thesis-latex-and-charts.zip"
          with zipfile.ZipFile(zip_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for root, _, files in os.walk(bundle_root):
                  for fname in sorted(files):
                      full_path = os.path.join(root, fname)
                      rel_path = os.path.relpath(full_path, bundle_root)
                      zf.write(full_path, rel_path)
          print(f"Created {zip_path} ({os.path.getsize(zip_path)} bytes)")
          EOF

      - name: Publish Thesis Artifacts Summary to GitHub Job Summary
        if: always()
        run: |
          echo "## Master's Thesis LaTeX Tables & 300 DPI Charts Bundle" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f build/thesis_bundle/summaries/markdown_summary.md ]; then
            cat build/thesis_bundle/summaries/markdown_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Master's Thesis Bundle Archive
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: master-thesis-latex-and-charts
          path: build/master-thesis-latex-and-charts.zip

  nightly-release:
    name: Build & Publish Nightly Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [fast-unit-tests, slow-repository-tests, slow-statistical-tests, remote-dht-tests, real-dht-measurements, dht-testbed, e2e-two-devices-test, adversarial-dht-simulation, multi-emulator-dht-real-e2e, continuous-fuzzing, network-chaos-resilience]
    if: success() && (inputs.skip_release != true)
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare Nightly APK
        id: prepare_apk
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE_TAG=$(date -u +'%Y-%m-%d')
          APK_NAME="PQChat.DHT-nightly-${DATE_TAG}-${SHORT_SHA}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish Nightly Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: "Nightly Build (${{ env.DATE_TAG }}-${{ env.SHORT_SHA }})"
          body: |
            ## 🌙 PQChat.DHT Nightly Build

            Automated daily developer build (`app-debug.apk`) after passing the full nightly test suite:
            - **Fast Unit Tests:** Passed (standard unit test suite)
            - **Slow Repository & Rekey Tests:** Passed (PQC Rekey, ChatRepository Concurrency, Polling, Property)
            - **Slow Statistical & Tor Tests:** Passed (Monte Carlo, Tor SOCKS5 fail-closed, Loopback Harness)
            - **Two Devices End-to-End Lifecycle:** Passed (Handshake, Rekey after 50 messages, Out-of-Order / SlidingWindowBitmap, Real DhtLeafNode by default; FakeDht available via manual opt-in)
            - **Real BEP 44 Remote Integration Tests:** Passed (Live Mainline DHT)
            - **Real DHT Loopback & Retention Suite:** Passed (500 iterations per environment, live Mainline DHT)
            - **DHT Real Traffic Testbed & Threat Analysis:** Passed (150 Kademlia nodes)
            - **Byzantine & Adversarial DHT Attack Simulation:** Passed (Sybil / Eclipse /24 subnet bucketing, Active Bit-Flipper & Tampering rejection, BEP 44 Sequence Rollback & Tombstone suppression, Global Timing Correlation Analysis)
            - **Continuous Fuzzing (Jazzer):** Passed (Bencode, KRPC, BinaryFrameCodec 0x01-0x0C + Cover-ACK, Png8Compressor, KeystoreCrypto)
            - **Network Chaos & Partition Resilience:** Passed (10%-40% UDP loss, mid-transfer partition, PQC rekey outage, CGNAT socket rebind, Tor fail-closed restart)
            - **Multi-Emulator Real DHT E2E Tests:** Passed by default (2-node direct chat, 3-node group chat, and 4-node group chat on live Mainline DHT; simulated 20-node testbed available via manual `use_fake_dht` opt-in)

            ### Build Metadata:
