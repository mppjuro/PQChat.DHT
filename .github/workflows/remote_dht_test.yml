name: Remote DHT Integration Tests (Nightly)

on:
  schedule:
    # Codziennie o 02:30 UTC
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      trials:
        description: 'Number of loopback trials or horizon'
        required: false
        default: '5'

jobs:
  real-bep44-remote-test:
    name: Real BEP 44 Remote Integration Tests (Live BitTorrent DHT)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Real BEP 44 Remote Integration Tests (with retry)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 2
          command: ./gradlew testDebugUnitTest -DrunRealDhtTests=true -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" --tests "org.pqchat.dht.dht.integration.RealBep44RemoteIntegrationTest*" --info

      - name: Upload Remote Test Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-bep44-test-results
          path: app/build/reports/tests/testDebugUnitTest/
