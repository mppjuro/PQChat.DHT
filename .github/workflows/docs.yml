name: Documentation (Dokka & pydoctor)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'tools/**'
      - 'docs/formal/verify_lemmas.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'tools/**'
      - 'docs/formal/verify_lemmas.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

jobs:
  build-docs:
    name: Build Kotlin (Dokka) & Python (pydoctor) Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Install Python documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-docs.txt

      - name: Generate Kotlin API Documentation (Dokka)
        run: ./gradlew :app:dokkaGenerateHtml --stacktrace

      - name: Generate Python API Documentation (pydoctor)
        run: python -m pydoctor

      - name: Verify Documentation Output & Build Portal Index
        run: |
          test -f build/docs/kotlin/index.html
          test -f build/docs/python/index.html

          cat > build/docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>PQChat.DHT API Documentation</title>
            <style>
              body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6; color: #1f2937; }
              h1 { margin-bottom: 0.5rem; }
              .cards { display: grid; gap: 1rem; margin-top: 2rem; }
              .card { display: block; padding: 1.25rem 1.5rem; border: 1px solid #d1d5db; border-radius: 0.5rem; text-decoration: none; color: inherit; }
              .card:hover { border-color: #2563eb; background: #f8fafc; }
              .card strong { display: block; font-size: 1.125rem; color: #1d4ed8; margin-bottom: 0.25rem; }
            </style>
          </head>
          <body>
            <h1>PQChat.DHT API Documentation</h1>
            <p>Automatically generated reference documentation for the Android Kotlin application and Python research/testing tooling.</p>
            <div class="cards">
              <a class="card" href="kotlin/index.html">
                <strong>Kotlin Android App (Dokka 2.3.0)</strong>
                <span>Post-Quantum cryptography, Kademlia BEP-44 leaf node, embedded Tor transport, Poisson cover traffic, Room database, and Jetpack Compose UI.</span>
              </a>
              <a class="card" href="python/index.html">
                <strong>Python Tooling &amp; Testbed (pydoctor)</strong>
                <span>E2E multi-emulator orchestrator, DHT retention CLI, isolated Kademlia testbed, threat correlation simulator, and verification scripts.</span>
              </a>
            </div>
          </body>
          </html>
          EOF

          KOTLIN_PAGES=$(find build/docs/kotlin -name "*.html" | wc -l)
          PYTHON_PAGES=$(find build/docs/python -name "*.html" | wc -l)
          echo "## 📚 Documentation Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Generator | Output Directory | Generated HTML Pages |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| Kotlin Android App | Dokka 2.3.0 | \`build/docs/kotlin/\` | ${KOTLIN_PAGES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tooling & Scripts | pydoctor | \`build/docs/python/\` | ${PYTHON_PAGES} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Kotlin API Docs Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dokka-kotlin-docs
          path: build/docs/kotlin/
          retention-days: 30

      - name: Upload Python API Docs Artifact
        uses: actions/upload-artifact@v7
        with:
          name: pydoctor-python-docs
          path: build/docs/python/
          retention-days: 30

      - name: Upload Combined Documentation Bundle
        uses: actions/upload-artifact@v7
        with:
          name: pqchat-api-docs-bundle
          path: build/docs/
          retention-days: 30
