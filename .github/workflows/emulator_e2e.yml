name: Multi-Emulator E2E & Physical UI Tests

on:
  workflow_dispatch:
    inputs:
      nodes:
        description: 'Number of emulator instances (2, 3, or 4)'
        required: true
        default: '3'
        type: choice
        options:
          - '2'
          - '3'
          - '4'
      api_level:
        description: 'Android API Level'
        required: true
        default: '34'
        type: string
  push:
    branches: [ "main", "fix/**", "test/**" ]
    paths:
      - 'app/**'
      - 'tools/e2e_emulator_orchestrator.py'
      - 'tools/testbed/**'
      - '.github/workflows/emulator_e2e.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'tools/e2e_emulator_orchestrator.py'
      - 'tools/testbed/**'
      - '.github/workflows/emulator_e2e.yml'

permissions:
  contents: read

jobs:
  instrumented-pixel-ui-tests:
    name: Instrumented UI Automator Tests (Single AVD)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Cache AVD snapshots
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.api_level || '34' }}

      - name: Build Debug & Test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run Instrumented Physical Pixel UI Automator Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: ./gradlew connectedDebugAndroidTest --continue --stacktrace --warning-mode summary

      - name: Dump Test Failure Reports
        if: failure()
        run: |
          echo "[FAILED] CONNECTED ANDROID TEST FAILED! Dumping test failure reports:"
          find app/build/reports/androidTests/connected -type f \( -name "*.html" -o -name "*.xml" \) || true
          find app/build/reports/androidTests -type f -name "*.xml" -exec echo "=== FILE: {} ===" \; -exec cat {} \; || true
          find app/build/outputs/androidTest-results -type f -name "*.xml" -exec echo "=== FILE: {} ===" \; -exec cat {} \; || true

      - name: Upload Connected Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-android-test-report
          path: app/build/reports/androidTests/connected/

  multi-emulator-dht-e2e:
    name: Multi-Emulator E2E (${{ matrix.nodes }} Nodes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        nodes: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.nodes)) || fromJSON('["3", "4"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Cache Android System Image
        uses: actions/cache@v6
        id: sysimg-cache
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ inputs.api_level || '34' }}
          key: sysimg-android-${{ inputs.api_level || '34' }}-x86_64

      - name: Set up Android SDK & Multi-Node AVDs
        run: |
          export API_LEVEL="${{ inputs.api_level || '34' }}"
          export SYS_IMG="system-images;android-${API_LEVEL};google_apis;x86_64"
          export NODES="${{ matrix.nodes }}"

          echo "=== Accepting Android SDK Licenses ==="
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          if [ ! -d "/usr/local/lib/android/sdk/system-images/android-${API_LEVEL}/google_apis/x86_64" ]; then
            echo "=== Installing System Image ($SYS_IMG) ==="
            echo "y" | sdkmanager --install "$SYS_IMG" "platforms;android-${API_LEVEL}" "emulator" "platform-tools"
          fi

          echo "=== Creating Alice AVD ==="
          echo "no" | avdmanager create avd -n alice_avd -k "$SYS_IMG" --device "pixel_6" --force

          echo "=== Creating Bob AVD ==="
          echo "no" | avdmanager create avd -n bob_avd -k "$SYS_IMG" --device "pixel_6" --force

          if [ "$NODES" -ge 3 ]; then
            echo "=== Creating Charlie AVD ==="
            echo "no" | avdmanager create avd -n charlie_avd -k "$SYS_IMG" --device "pixel_6" --force
          fi

          if [ "$NODES" -ge 4 ]; then
            echo "=== Creating Dave AVD ==="
            echo "no" | avdmanager create avd -n dave_avd -k "$SYS_IMG" --device "pixel_6" --force
          fi

          for avd_dir in ~/.android/avd/*.avd; do
            if [ -d "$avd_dir" ]; then
              echo "hw.keyboard = yes" >> "$avd_dir/config.ini"
              echo "hw.ramSize = 2048" >> "$avd_dir/config.ini"
              echo "vm.heapSize = 512" >> "$avd_dir/config.ini"
            fi
          done

          avdmanager list avd

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Launch Android Emulators Headless
        run: |
          EMU_OPTS="-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -no-metrics -no-snapshot-save -memory 2048"
          NODES="${{ matrix.nodes }}"

          echo "Starting Alice (emulator-5554)..."
          $ANDROID_HOME/emulator/emulator -avd alice_avd -port 5554 $EMU_OPTS &

          echo "Starting Bob (emulator-5556)..."
          $ANDROID_HOME/emulator/emulator -avd bob_avd -port 5556 $EMU_OPTS &

          if [ "$NODES" -ge 3 ]; then
            echo "Starting Charlie (emulator-5558)..."
            $ANDROID_HOME/emulator/emulator -avd charlie_avd -port 5558 $EMU_OPTS &
          fi

          if [ "$NODES" -ge 4 ]; then
            echo "Starting Dave (emulator-5560)..."
            $ANDROID_HOME/emulator/emulator -avd dave_avd -port 5560 $EMU_OPTS &
          fi

          echo "All requested emulator instances spawned in background."

      - name: Wait for All Emulators to Complete Boot
        run: |
          python3 - << 'EOF'
          import subprocess, time, sys, os

          nodes = int("${{ matrix.nodes }}")
          device_ports = [5554, 5556]
          if nodes >= 3:
              device_ports.append(5558)
          if nodes >= 4:
              device_ports.append(5560)

          devices = [f"emulator-{p}" for p in device_ports]
          timeout_seconds = 420
          start_time = time.time()

          for dev in devices:
              print(f"Waiting for {dev} to be ready...", flush=True)
              while time.time() - start_time < timeout_seconds:
                  try:
                      res = subprocess.run(
                          ["adb", "-s", dev, "shell", "getprop", "sys.boot_completed"],
                          capture_output=True,
                          text=True,
                          timeout=10
                      )
                      if res.stdout.strip() == "1":
                          print(f"[{dev}] sys.boot_completed == 1. Ready!", flush=True)
                          break
                  except Exception:
                      pass
                  time.sleep(3)
              else:
                  print(f"ERROR: {dev} failed to boot within {timeout_seconds} seconds!", file=sys.stderr)
                  sys.exit(1)

          print(f"All {len(devices)} emulators successfully booted!", flush=True)
          EOF

          NODES="${{ matrix.nodes }}"
          DEVS="emulator-5554 emulator-5556"
          if [ "$NODES" -ge 3 ]; then DEVS="$DEVS emulator-5558"; fi
          if [ "$NODES" -ge 4 ]; then DEVS="$DEVS emulator-5560"; fi

          for dev in $DEVS; do
            adb -s $dev shell settings put global window_animation_scale 0.0
            adb -s $dev shell settings put global transition_animation_scale 0.0
            adb -s $dev shell settings put global animator_duration_scale 0.0
            adb -s $dev shell svc power stayon true
          done

          adb devices -l

      - name: Run Multi-Emulator E2E Orchestrator
        run: |
          mkdir -p build/e2e-screenshots-${{ matrix.nodes }}nodes
          python tools/e2e_emulator_orchestrator.py \
            --nodes ${{ matrix.nodes }} \
            --alice emulator-5554 \
            --bob emulator-5556 \
            --charlie emulator-5558 \
            --dave emulator-5560 \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --output-dir build/e2e-screenshots-${{ matrix.nodes }}nodes \
            --full

      - name: Publish E2E Summary to GitHub Job Summary
        if: always()
        run: |
          REPORT_FILE="build/e2e-screenshots-${{ matrix.nodes }}nodes/report.md"
          echo "## 📱 Multi-Emulator E2E Results (${{ matrix.nodes }} Nodes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Report file $REPORT_FILE was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload E2E Screenshots & Trace Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-trace-${{ matrix.nodes }}nodes
          path: build/e2e-screenshots-${{ matrix.nodes }}nodes/

      - name: Stop Emulators
        if: always()
        run: |
          for port in 5554 5556 5558 5560; do
            adb -s emulator-$port emu kill 2>/dev/null || true
          done
