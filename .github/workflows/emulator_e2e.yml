name: Multi-Emulator E2E & Physical UI Tests

on:
  workflow_dispatch:
    inputs:
      nodes:
        description: 'Number of emulator instances (2 or 3)'
        required: true
        default: '3'
        type: choice
        options:
          - '2'
          - '3'
      api_level:
        description: 'Android API Level'
        required: true
        default: '34'
        type: string
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'tools/e2e_emulator_orchestrator.py'
      - '.github/workflows/emulator_e2e.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'tools/e2e_emulator_orchestrator.py'
      - '.github/workflows/emulator_e2e.yml'

permissions:
  contents: read

jobs:
  instrumented-ui-and-multi-e2e:
    name: Instrumented UI & Multi-Node E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APKs (Debug & AndroidTest)
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run Instrumented UI & Physical Pixel Automation Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Run Multi-Emulator E2E Orchestrator
        run: |
          python tools/e2e_emulator_orchestrator.py \
            --nodes ${{ inputs.nodes || '3' }} \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --output-dir build/e2e-screenshots \
            --dry-run

      - name: Upload E2E Screenshots & Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-multi-emulator-report
          path: build/e2e-screenshots/

      - name: Upload Connected Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-android-test-report
          path: app/build/reports/androidTests/connected/
