name: Multi-Emulator E2E & Physical UI Tests

on:
  workflow_dispatch:
    inputs:
      nodes:
        description: 'Number of emulator instances (2 or 3)'
        required: true
        default: '2'
        type: choice
        options:
          - '2'
          - '3'
      api_level:
        description: 'Android API Level'
        required: true
        default: '34'
        type: string
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'tools/e2e_emulator_orchestrator.py'
      - 'tools/testbed/**'
      - '.github/workflows/emulator_e2e.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'tools/e2e_emulator_orchestrator.py'
      - 'tools/testbed/**'
      - '.github/workflows/emulator_e2e.yml'

permissions:
  contents: read

jobs:
  instrumented-ui-and-multi-e2e:
    name: Instrumented UI & Multi-Node E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Cache AVD snapshots
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.api_level || '34' }}

      - name: Build Debug & Test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run Instrumented Physical Pixel UI Automator Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            ./gradlew connectedDebugAndroidTest

      - name: Run Multi-Emulator E2E Orchestrator
        run: |
          mkdir -p build/e2e-screenshots
          python tools/e2e_emulator_orchestrator.py \
            --nodes ${{ inputs.nodes || '2' }} \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --output-dir build/e2e-screenshots \
            --dry-run

      - name: Publish E2E Summary to GitHub Job Summary
        if: always()
        run: |
          echo "## 📱 Multi-Emulator E2E & Physical UI Automation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "build/e2e-screenshots/report.md" ]; then
            cat build/e2e-screenshots/report.md >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Report file build/e2e-screenshots/report.md was not generated." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 JUnit Instrumented Test Results" >> $GITHUB_STEP_SUMMARY
          if [ -d "app/build/reports/androidTests/connected" ]; then
            echo "- ✅ Connected AndroidTest HTML reports successfully generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload E2E Screenshots & Trace
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-multi-emulator-trace
          path: build/e2e-screenshots/

      - name: Upload Connected Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-android-test-report
          path: app/build/reports/androidTests/connected/
