name: Multi-Emulator E2E & Physical UI Tests

on:
  workflow_dispatch:
    inputs:
      nodes:
        description: 'Number of emulator instances (2, 3, or 4)'
        required: true
        default: '3'
        type: choice
        options:
          - '2'
          - '3'
          - '4'
      api_level:
        description: 'Android API Level'
        required: true
        default: '34'
        type: string
  push:
    branches: [ "main", "fix/**", "test/**" ]
    paths:
      - 'app/**'
      - 'tools/e2e_emulator_orchestrator.py'
      - 'tools/testbed/**'
      - '.github/workflows/emulator_e2e.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'tools/e2e_emulator_orchestrator.py'
      - 'tools/testbed/**'
      - '.github/workflows/emulator_e2e.yml'

permissions:
  contents: read

jobs:
  instrumented-pixel-ui-tests:
    name: Instrumented UI Automator Tests (Single AVD)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          sudo usermod -aG kvm $USER || true
          ls -la /dev/kvm || true

      - name: Allocate 10GB Swap Space
        run: |
          echo "=== Configuring 10GB swap file for multi-emulator stability ==="
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Cache AVD snapshots
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.api_level || '34' }}

      - name: Build Debug & Test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Run Instrumented Physical Pixel UI Automator Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: ./gradlew connectedDebugAndroidTest --continue --stacktrace --warning-mode summary

      - name: Dump Test Failure Reports
        if: failure()
        run: |
          echo "[FAILED] CONNECTED ANDROID TEST FAILED! Dumping test failure reports:"
          find app/build/reports/androidTests/connected -type f \( -name "*.html" -o -name "*.xml" \) || true
          find app/build/reports/androidTests -type f -name "*.xml" -exec echo "=== FILE: {} ===" \; -exec cat {} \; || true
          find app/build/outputs/androidTest-results -type f -name "*.xml" -exec echo "=== FILE: {} ===" \; -exec cat {} \; || true

      - name: Upload Connected Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connected-android-test-report
          path: app/build/reports/androidTests/connected/

  multi-emulator-dht-e2e:
    name: Multi-Emulator E2E (${{ matrix.nodes }} Nodes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        nodes: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.nodes)) || fromJSON('["3", "4"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          sudo usermod -aG kvm $USER || true
          ls -la /dev/kvm || true

      - name: Allocate 10GB Swap Space
        run: |
          echo "=== Configuring 10GB swap file for multi-emulator stability ==="
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Configure Android SDK Environment and PATH
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> $GITHUB_ENV

          # Detect cmdline-tools directory containing sdkmanager and avdmanager
          CMDLINE_DIR=""
          if [ -d "$ANDROID_ROOT/cmdline-tools/latest/bin" ]; then
            CMDLINE_DIR="$ANDROID_ROOT/cmdline-tools/latest/bin"
          else
            for d in "$ANDROID_ROOT/cmdline-tools"/*/bin; do
              if [ -x "$d/sdkmanager" ]; then
                CMDLINE_DIR="$d"
                break
              fi
            done
          fi

          if [ -n "$CMDLINE_DIR" ]; then
            echo "Configuring cmdline-tools from: $CMDLINE_DIR"
            echo "$CMDLINE_DIR" >> $GITHUB_PATH
          fi

          echo "$ANDROID_ROOT/emulator" >> $GITHUB_PATH
          echo "$ANDROID_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Cache Android System Image
        uses: actions/cache@v6
        id: sysimg-cache
        with:
          path: /usr/local/lib/android/sdk/system-images/android-${{ inputs.api_level || '34' }}
          key: sysimg-android-${{ inputs.api_level || '34' }}-x86_64

      - name: Set up Android SDK & Multi-Node AVDs
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          # Ensure tools are on PATH in current subshell
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi
          for d in "$ANDROID_HOME/cmdline-tools"/*/bin; do
            if [ -x "$d/sdkmanager" ]; then
              export PATH="$d:$PATH"
              break
            fi
          done
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          echo "sdkmanager location: $(command -v sdkmanager || echo 'not found')"
          echo "avdmanager location: $(command -v avdmanager || echo 'not found')"
          echo "adb location: $(command -v adb || echo 'not found')"

          export API_LEVEL="${{ inputs.api_level || '34' }}"
          export SYS_IMG="system-images;android-${API_LEVEL};google_apis;x86_64"
          export NODES="${{ matrix.nodes }}"

          echo "=== Accepting Android SDK Licenses ==="
          yes 2>/dev/null | sdkmanager --licenses > /dev/null || true

          if [ ! -d "$ANDROID_HOME/system-images/android-${API_LEVEL}/google_apis/x86_64" ]; then
            echo "=== Installing System Image ($SYS_IMG) ==="
            yes 2>/dev/null | sdkmanager --install "$SYS_IMG" "platforms;android-${API_LEVEL}" "emulator" "platform-tools"
          fi

          mkdir -p ~/.android/avd

          echo "=== Creating Alice AVD ==="
          echo "no" | avdmanager create avd -n alice_avd -k "$SYS_IMG" --device "pixel_6" --force || \
          echo "no" | avdmanager create avd -n alice_avd -k "$SYS_IMG" --force

          echo "=== Creating Bob AVD ==="
          echo "no" | avdmanager create avd -n bob_avd -k "$SYS_IMG" --device "pixel_6" --force || \
          echo "no" | avdmanager create avd -n bob_avd -k "$SYS_IMG" --force

          if [ "$NODES" -ge 3 ]; then
            echo "=== Creating Charlie AVD ==="
            echo "no" | avdmanager create avd -n charlie_avd -k "$SYS_IMG" --device "pixel_6" --force || \
            echo "no" | avdmanager create avd -n charlie_avd -k "$SYS_IMG" --force
          fi

          if [ "$NODES" -ge 4 ]; then
            echo "=== Creating Dave AVD ==="
            echo "no" | avdmanager create avd -n dave_avd -k "$SYS_IMG" --device "pixel_6" --force || \
            echo "no" | avdmanager create avd -n dave_avd -k "$SYS_IMG" --force
          fi

          for avd_dir in ~/.android/avd/*.avd; do
            if [ -d "$avd_dir" ]; then
              sed -i '/hw.keyboard/d' "$avd_dir/config.ini" || true
              sed -i '/hw.ramSize/d' "$avd_dir/config.ini" || true
              sed -i '/vm.heapSize/d' "$avd_dir/config.ini" || true
              echo "hw.keyboard = yes" >> "$avd_dir/config.ini"
              echo "hw.ramSize = 1536" >> "$avd_dir/config.ini"
              echo "vm.heapSize = 256" >> "$avd_dir/config.ini"
            fi
          done

          avdmanager list avd

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Launch Android Emulators Headless
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          EMULATOR_BIN="$(command -v emulator || echo "$ANDROID_HOME/emulator/emulator")"

          EMU_OPTS="-no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -no-metrics -no-snapshot-save -memory 1536 -cores 1"
          NODES="${{ matrix.nodes }}"

          mkdir -p /tmp/emu_logs

          echo "Starting Alice (emulator-5554)..."
          nohup $EMULATOR_BIN -avd alice_avd -port 5554 $EMU_OPTS > /tmp/emu_5554.log 2>&1 &
          sleep 5

          echo "Starting Bob (emulator-5556)..."
          nohup $EMULATOR_BIN -avd bob_avd -port 5556 $EMU_OPTS > /tmp/emu_5556.log 2>&1 &
          sleep 5

          if [ "$NODES" -ge 3 ]; then
            echo "Starting Charlie (emulator-5558)..."
            nohup $EMULATOR_BIN -avd charlie_avd -port 5558 $EMU_OPTS > /tmp/emu_5558.log 2>&1 &
            sleep 5
          fi

          if [ "$NODES" -ge 4 ]; then
            echo "Starting Dave (emulator-5560)..."
            nohup $EMULATOR_BIN -avd dave_avd -port 5560 $EMU_OPTS > /tmp/emu_5560.log 2>&1 &
            sleep 5
          fi

          echo "All requested emulator instances spawned in background with nohup."
          sleep 5
          adb devices -l || true

      - name: Wait for All Emulators to Complete Boot
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          python3 - << 'EOF'
          import subprocess, time, sys, os

          subprocess.run(["adb", "start-server"], check=False)

          nodes = int("${{ matrix.nodes }}")
          device_ports = [5554, 5556]
          if nodes >= 3:
              device_ports.append(5558)
          if nodes >= 4:
              device_ports.append(5560)

          devices = [f"emulator-{p}" for p in device_ports]
          timeout_seconds = 420
          start_time = time.time()

          for dev in devices:
              print(f"Waiting for {dev} to be ready...", flush=True)
              while time.time() - start_time < timeout_seconds:
                  try:
                      res = subprocess.run(
                          ["adb", "-s", dev, "shell", "getprop", "sys.boot_completed"],
                          capture_output=True,
                          text=True,
                          timeout=10
                      )
                      if res.stdout.strip() == "1":
                          print(f"[{dev}] sys.boot_completed == 1. Ready!", flush=True)
                          break
                  except Exception:
                      pass
                  time.sleep(3)
              else:
                  print(f"ERROR: {dev} failed to boot within {timeout_seconds} seconds!", file=sys.stderr)
                  port = dev.replace("emulator-", "")
                  log_file = f"/tmp/emu_{port}.log"
                  if os.path.exists(log_file):
                      print(f"\n=== EMULATOR LOG DUMP ({log_file}) ===", file=sys.stderr)
                      with open(log_file, "r", errors="replace") as f:
                          lines = f.readlines()
                          print("".join(lines[-100:]), file=sys.stderr)
                  sys.exit(1)

          print(f"All {len(devices)} emulators successfully booted!", flush=True)
          EOF

          NODES="${{ matrix.nodes }}"
          DEVS="emulator-5554 emulator-5556"
          if [ "$NODES" -ge 3 ]; then DEVS="$DEVS emulator-5558"; fi
          if [ "$NODES" -ge 4 ]; then DEVS="$DEVS emulator-5560"; fi

          for dev in $DEVS; do
            adb -s $dev wait-for-device
            adb -s $dev shell settings put global window_animation_scale 0.0
            adb -s $dev shell settings put global transition_animation_scale 0.0
            adb -s $dev shell settings put global animator_duration_scale 0.0
            adb -s $dev shell svc power stayon true
          done

          adb devices -l

      - name: Run Multi-Emulator E2E Orchestrator
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          mkdir -p build/e2e-screenshots-${{ matrix.nodes }}nodes
          python3 tools/e2e_emulator_orchestrator.py \
            --nodes ${{ matrix.nodes }} \
            --alice emulator-5554 \
            --bob emulator-5556 \
            --charlie emulator-5558 \
            --dave emulator-5560 \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --output-dir build/e2e-screenshots-${{ matrix.nodes }}nodes \
            --full

      - name: Publish E2E Summary to GitHub Job Summary
        if: always()
        run: |
          REPORT_FILE="build/e2e-screenshots-${{ matrix.nodes }}nodes/report.md"
          echo "## 📱 Multi-Emulator E2E Results (${{ matrix.nodes }} Nodes)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "$REPORT_FILE" ]; then
            cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Report file $REPORT_FILE was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload E2E Screenshots & Trace Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-trace-${{ matrix.nodes }}nodes
          path: |
            build/e2e-screenshots-${{ matrix.nodes }}nodes/
            /tmp/emu_*.log

      - name: Stop Emulators
        if: always()
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          for port in 5554 5556 5558 5560; do
            adb -s emulator-$port emu kill 2>/dev/null || true
          done
