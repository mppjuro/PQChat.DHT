name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Numer wersji wydania (np. 0.0.1)'
        required: true
        type: string
        default: '0.0.1'
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Run Quality Verification (Lint & Tests)
        run: |
          ./gradlew lintDebug
          ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare Release APK
        id: prepare_release
        run: |
          RAW_VERSION="${{ inputs.version }}"
          # Strip optional 'v' prefix if given e.g. 'v0.0.1'
          CLEAN_VERSION="${RAW_VERSION#v}"
          APK_NAME="PQChat.DHT-${CLEAN_VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=v${CLEAN_VERSION}" >> $GITHUB_ENV

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: "PQChat.DHT v${{ env.VERSION }}"
          body: |
            ## 🚀 PQChat.DHT v${{ env.VERSION }}

            Official release of **PQChat.DHT** — decentralized P2P messenger with post-quantum cryptography (ML-KEM-512) and traffic shaping over BitTorrent Mainline DHT.

            - **Wersja:** `v${{ env.VERSION }}`
            - **Commit:** [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Included APK package:** `${{ env.APK_NAME }}`

            Detailed list of changes is available in [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ${{ env.APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
