name: Manual Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version number (e.g. 0.0.1)'
        required: true
        type: string
        default: '0.0.1'
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
  FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "Decoded app/google-services.json from GitHub Secrets."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set; using BuildConfig fallback or offline mode."
          fi

      - name: Run Quality Verification (Lint & Tests)
        run: |
          ./gradlew lintDebug
          ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Prepare Release APK
        id: prepare_release
        run: |
          RAW_VERSION="${{ inputs.version }}"
          # Strip optional 'v' prefix if given e.g. 'v0.0.1'
          CLEAN_VERSION="${RAW_VERSION#v}"
          APK_NAME="PQChat.DHT-${CLEAN_VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "APK_NAME=${APK_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=v${CLEAN_VERSION}" >> $GITHUB_ENV

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Generate Release Changelog (Full Delta Since Previous Release)
        run: |
          mkdir -p build
          python3 scripts/generate_changelog.py --output build/CHANGELOG.md
          PREV_TAG=$(git tag --list 'v*' --sort=-creatordate | grep -vx "${TAG_NAME}" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            echo "Generating release delta since tag: $PREV_TAG"
            python3 scripts/generate_changelog.py --since "$PREV_TAG" --no-header --output build/release_delta.md
            DELTA_HEADING="### Changes Since ${PREV_TAG}"
          else
            python3 scripts/generate_changelog.py --no-header --output build/release_delta.md
            DELTA_HEADING="### Changelog"
          fi
          cat << EOF > build/release_body.md
          ## 🚀 PQChat.DHT v${VERSION}

          Official release of **PQChat.DHT** — decentralized P2P messenger with post-quantum cryptography (ML-KEM-512) and traffic shaping over BitTorrent Mainline DHT.

          - **Version:** \`v${VERSION}\`
          - **Commit:** [\`${GITHUB_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})
          - **Included APK package:** \`${APK_NAME}\`

          ${DELTA_HEADING}

          EOF
          if [ -s build/release_delta.md ]; then
            cat build/release_delta.md >> build/release_body.md
          else
            echo "_No new commits since previous release._" >> build/release_body.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: "PQChat.DHT v${{ env.VERSION }}"
          body_path: build/release_body.md
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          files: |
            ${{ env.APK_NAME }}
            build/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
