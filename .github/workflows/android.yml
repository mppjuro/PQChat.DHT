name: Android CI (Fast Tests)

on:
  push:
    branches: [ "main", "fix/**", "test/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_PREFS_ROOT: /home/runner
  ANDROID_SDK_HOME: /home/runner
  ANDROID_AVD_HOME: /home/runner/.android/avd

jobs:
  unit-tests-and-lint:
    name: Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Verify 100% English Language Unification
        run: python3 scripts/check_language_unification.py

      - name: Verify Room Schema Consistency
        run: |
          ./gradlew kspDebugKotlin
          if ! git diff --exit-code app/schemas; then
            echo "ERROR: Room schema files are not up-to-date with current database entities!"
            echo "Please build the project and commit the updated schema files under app/schemas/."
            exit 1
          fi

      - name: Generate Unit Test Job Summary
        if: always()
        run: |
          echo "## ⚡ Android CI Fast Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          if [ -d "app/build/reports/tests/testDebugUnitTest" ]; then
            echo "| Fast Unit Tests (JUnit 5) | ✅ PASS |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Fast Unit Tests (JUnit 5) | ❌ FAIL |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "app/build/reports/lint-results-debug.html" ]; then
            echo "| Android Lint | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Language Unification (EN) | ✅ Verified (0 Polish characters) |" >> $GITHUB_STEP_SUMMARY
          echo "| Room Schema Consistency | ✅ Synchronized |" >> $GITHUB_STEP_SUMMARY

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

  instrumented-tests:
    name: Instrumented Tests (Android Emulator)
    runs-on: ubuntu-latest
    needs: unit-tests-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode Google Services JSON (Optional)
        if: ${{ env.GOOGLE_SERVICES_JSON_BASE64 != '' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm || true

      - name: Cache AVD snapshots
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: Run Instrumented Tests via AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: ./gradlew connectedDebugAndroidTest --continue --stacktrace --warning-mode summary

      - name: Dump Test Failure Reports
        if: failure()
        run: |
          echo "[FAILED] CONNECTED ANDROID TEST FAILED! Dumping test failure reports:"
          find app/build/reports/androidTests/connected -type f \( -name "*.html" -o -name "*.xml" \) || true
          find app/build/reports/androidTests -type f -name "*.xml" -exec echo "=== FILE: {} ===" \; -exec cat {} \; || true
          find app/build/outputs/androidTest-results -type f -name "*.xml" -exec echo "=== FILE: {} ===" \; -exec cat {} \; || true

      - name: Generate Instrumented Test Job Summary
        if: always()
        run: |
          echo "## 📱 Instrumented AVD Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python3 scripts/summarize_test_results.py >> $GITHUB_STEP_SUMMARY || true

      - name: Upload Instrumented Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results
          path: app/build/reports/androidTests/connected/

  update-changelog:
    name: Generate & Update Changelog
    runs-on: ubuntu-latest
    needs: unit-tests-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate Changelog
        run: python scripts/generate_changelog.py

      - name: Commit & Push updated CHANGELOG
        run: |
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "docs(changelog): auto-update CHANGELOG.md [skip ci]"
            git push
          else
            echo "CHANGELOG.md is already up to date."
          fi
